# Configurations
set-option -g status-position top
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 0

# Keymap
set -g prefix C-s
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind h split-window -h
bind v split-window -v
setw -g mouse on
set -g default-terminal "screen-256color"
unbind r
bind r source-file ~/.tmux.conf

# Plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "catppuccin/tmux"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Catppuccin
set -g @catppuccin_status_background "default"

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory user host session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g status-right '#{?#{==:#{@claude_notify},off},#[fg=#f38ba8]🔕 ,}#(python3 ~/.config/tmux/scripts/claude-limits.py) #[fg=#6c7086]│#[default] %H:%M '
set -g @catppuccin_directory_text "#{pane_current_path}"

set -g @resurrect-strategy-nvim 'session'
# TPM
run "~/.tmux/plugins/tpm/tpm"


# ─── Browser-style window tabs ───────────────────────────────────────────────
set -g focus-events on
set -g status-interval 10

# The catppuccin/tmux plugin listed in @plugin was never actually cloned
# (~/.tmux/plugins/tmux is an empty directory), so the bar was still running on
# tmux's built-in bg=green, which is what made the status text unreadable.
# Mocha is applied directly here so the colours no longer depend on it.
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-style default
set -g status-right-style default
# An unnamed session is called "0", which rendered as a purple pill that read
# exactly like an empty tab. Only show the badge once the session has a real
# name; `tmux rename-session <name>` brings it back.
set -g status-left "#{?#{m/r:^[0-9]+$,#S},,#[fg=#11111b#,bg=#cba6f7#,bold] #S #[fg=#cba6f7#,bg=default#,nobold] }"
set -g status-left-length 40
set -g status-right-length 100
set -g message-style "bg=#313244,fg=#cdd6f4"

# Each window is a tab labelled with the session name of its first Claude Code
# pane, or the command in its first pane when there is no agent. Yellow when a
# pane is waiting on input, green when one has finished, blue while one works.
set -g window-status-separator ""
set -g window-status-format "#(~/.config/tmux/scripts/claude-window-label.sh #{window_id})"
set -g window-status-current-format "#(~/.config/tmux/scripts/claude-window-label.sh #{window_id})"

# Clear the green once the pane has been looked at, so a stale "done" never
# competes with a fresh one. Indexed so re-sourcing replaces rather than stacks.
set-hook -g pane-focus-in[50] "if -F '#{==:#{@claude_state},done}' 'set -p @claude_state idle'"
set-hook -g after-select-pane[50] "if -F '#{==:#{@claude_state},done}' 'set -p @claude_state idle'"

# Pane headers are off now that the tabs carry the naming. Set this to `top` to
# get them back when one window holds several agents at once.
set -g pane-border-status off
set -g pane-border-lines single
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#585b70"
set -g @hdr_accent "#{?#{==:#{@claude_state},done},#a6e3a1,#{?#{==:#{@claude_state},needs-input},#f9e2af,#{?#{==:#{@claude_state},running},#89b4fa,#{?pane_active,#585b70,#313244}}}}"
set -g pane-border-format "#[fg=#{E:@hdr_accent},bg=default]#[fg=#11111b,bg=#{E:@hdr_accent},bold] #{pane_index} #[fg=#{?pane_active,#cdd6f4,#6c7086},bg=#313244,nobold] #{=40:#{?#{@claude_state},#{pane_title},#{pane_current_command}  #{b:pane_current_path}}} #[fg=#313244,bg=default,none]"

# ─── Claude notification mute switch ─────────────────────────────────────────
# prefix + N toggles the noctalia notifications. claude-notify.py reads this
# option, and a 🔕 appears in the status bar while they are off.
set -g @claude_notify on
bind N if -F '#{==:#{@claude_notify},off}' \
  'set -g @claude_notify on  ; display-message "Claude notifications: on"' \
  'set -g @claude_notify off ; display-message "Claude notifications: muted"'
